<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS // Coding Console</title>
<style>
  :root{
    --bg:#0a0e12; --panel:#10161c; --panel2:#151d24; --line:#22303a;
    --text:#dbe6ec; --muted:#6f8493; --accent:#4fd1e8; --accent-dim:#2a5c66;
    --warn:#e8a94f; --danger:#e86a6a; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .brand h1{font-size:15px;letter-spacing:.04em;font-weight:600;margin:0;}
  .brand span{color:var(--muted);font-size:12px;}
  #settingsBtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
  #settingsBtn:hover{border-color:var(--accent);color:var(--accent);}

  #main{flex:1;display:flex;overflow:hidden;}
  #chat{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #orbWrap{display:flex;justify-content:center;align-items:center;padding:18px 0 6px;flex-shrink:0;}
  #orbCanvas{display:block;}

  #log{flex:1;overflow-y:auto;padding:18px;}
  .msg{max-width:78%;margin-bottom:14px;line-height:1.5;font-size:14px;}
  .msg.user{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:10px 14px;}
  .msg.ai{background:none;padding:2px 0;}
  .msg.ai .who{color:var(--accent);font-size:11px;letter-spacing:.05em;margin-bottom:4px;}
  .msg.sys{color:var(--muted);font-size:12px;text-align:center;margin:10px 0;}
  .msg pre{background:#080b0e;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;}
  .msg code{font-family:var(--mono);}

  #inputbar{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px;display:flex;gap:10px;align-items:center;}
  #textInput{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;resize:none;font-family:inherit;}
  #textInput:focus{outline:none;border-color:var(--accent);}
  .iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent);}
  #micBtn.listening{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,106,106,.5);}50%{box-shadow:0 0 0 8px rgba(232,106,106,0);}}
  #sendBtn{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

  #sidebar{width:280px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow-y:auto;display:none;flex-direction:column;gap:16px;}
  #sidebar.open{display:flex;}
  .field label{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px;}
  .field select,.field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font-size:13px;}
  .field select:focus,.field input:focus{outline:none;border-color:var(--accent);}
  .section-title{font-size:11px;color:var(--accent);letter-spacing:.06em;margin:4px 0 2px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .provkey{display:none;}
  .provkey.active{display:block;}
  .hint{font-size:11px;color:var(--muted);line-height:1.4;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .save-note{font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><h1>JARVIS</h1><span>coding console</span></div>
    <button id="settingsBtn">⚙ Settings</button>
  </header>

  <div id="main">
    <div id="chat">
      <div id="orbWrap"><canvas id="orbCanvas" width="180" height="180"></canvas></div>
      <div id="log"></div>
      <div id="inputbar">
        <button class="iconbtn" id="photoBtn" title="Attach image">📷</button>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
        <button class="iconbtn" id="micBtn" title="Voice input">🎤</button>
        <div id="inputcol" style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div id="preview" style="display:none;position:relative;width:fit-content;">
            <img id="previewImg" style="max-height:70px;border-radius:6px;border:1px solid var(--line);display:block;">
            <button id="clearPhoto" title="Remove" style="position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;">✕</button>
          </div>
          <textarea id="textInput" rows="1" placeholder="Ask for code, a fix, an explanation..." style="width:100%;"></textarea>
        </div>
        <button class="iconbtn" id="sendBtn" title="Send">➤</button>
      </div>
    </div>

    <div id="sidebar">
      <div class="section-title">PROVIDER</div>
      <div class="field">
        <label>Active provider</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="gemini">Google Gemini</option>
          <option value="ollama">Local (Ollama)</option>
        </select>
      </div>

      <div id="key-openai" class="provkey">
        <div class="field"><label>OpenAI API key</label><input type="password" id="k-openai" placeholder="sk-..."></div>
        <div class="field"><label>Model</label><input type="text" id="m-openai" value="gpt-4o"></div>
      </div>
      <div id="key-anthropic" class="provkey">
        <div class="field"><label>Anthropic API key</label><input type="password" id="k-anthropic" placeholder="sk-ant-..."></div>
        <div class="field"><label>Model</label><input type="text" id="m-anthropic" value="claude-sonnet-4-6"></div>
      </div>
      <div id="key-gemini" class="provkey">
        <div class="field"><label>Gemini API key</label><input type="password" id="k-gemini" placeholder="AIza..."></div>
        <div class="field"><label>Model</label><input type="text" id="m-gemini" value="gemini-2.5-pro"></div>
      </div>
      <div id="key-ollama" class="provkey">
        <div class="field"><label>Ollama endpoint</label><input type="text" id="k-ollama" value="http://localhost:11434"></div>
        <div class="field"><label>Model</label><input type="text" id="m-ollama" value="qwen2.5-coder"></div>
      </div>

      <div class="section-title">VOICE</div>
      <div class="toggle-row"><span>Speak replies</span><input type="checkbox" id="voiceOut" checked></div>

      <div class="section-title">ABOUT</div>
      <div class="hint">Keys are stored only in this browser's local storage. No requests leave your machine except directly to the provider you pick. Switch providers anytime — each message uses whichever is active.</div>
      <div class="save-note" id="saveNote"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log');

// ---- Rotating blue particle sphere ----
(function(){
  const canvas = $('orbCanvas'), ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2;
  const R = 62, N = 180;
  const pts = [];
  for(let i=0;i<N;i++){
    const t = i + 0.5, phi = Math.acos(1 - 2*t/N), theta = Math.PI*(1+Math.sqrt(5))*i;
    pts.push({
      x: Math.cos(theta)*Math.sin(phi)*R,
      y: Math.sin(theta)*Math.sin(phi)*R,
      z: Math.cos(phi)*R
    });
  }
  let ry = 0, rx = 0.4, speed = 0.006, pulse = 0;
  window.orbState = 'idle'; // idle | thinking | listening | speaking

  function frame(){
    ry += speed;
    if(window.orbState==='thinking') speed = 0.028;
    else if(window.orbState==='listening') speed = 0.018;
    else if(window.orbState==='speaking'){ speed = 0.014; pulse = (pulse+0.12)%(Math.PI*2); }
    else speed = 0.006;

    ctx.clearRect(0,0,W,H);
    const cosY=Math.cos(ry), sinY=Math.sin(ry), cosX=Math.cos(rx), sinX=Math.sin(rx);
    const proj = pts.map(p=>{
      let x = p.x*cosY - p.z*sinY;
      let z = p.x*sinY + p.z*cosY;
      let y = p.y*cosX - z*sinX;
      z = p.y*sinX + z*cosX;
      const scale = window.orbState==='speaking' ? 1 + 0.08*Math.sin(pulse) : 1;
      return {x:x*scale, y:y*scale, z:z*scale};
    }).sort((a,b)=>a.z-b.z);

    proj.forEach(p=>{
      const depth = (p.z + R) / (2*R); // 0..1
      const size = 1 + depth*2.2;
      const alpha = 0.25 + depth*0.75;
      const shade = window.orbState==='listening' ? [232,106,106] :
                    window.orbState==='thinking' ? [232,169,79] : [79,209,232];
      ctx.beginPath();
      ctx.arc(cx + p.x, cy + p.y, size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${shade[0]},${shade[1]},${shade[2]},${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

addMsg('sys', 'Set your API key(s) in Settings, pick a provider, then talk or type. Everything runs from your own browser — no middleman server.');

const provSel = $('provider');
const keyFields = {openai:$('key-openai'),anthropic:$('key-anthropic'),gemini:$('key-gemini'),ollama:$('key-ollama')};

function loadSettings(){
  const s = JSON.parse(localStorage.getItem('jarvis-settings')||'{}');
  if(s.provider) provSel.value = s.provider;
  ['openai','anthropic','gemini'].forEach(p=>{ if(s[p+'_key']) $('k-'+p).value = s[p+'_key']; if(s[p+'_model']) $('m-'+p).value = s[p+'_model']; });
  if(s.ollama_url) $('k-ollama').value = s.ollama_url;
  if(s.ollama_model) $('m-ollama').value = s.ollama_model;
  if(s.voiceOut===false) $('voiceOut').checked=false;
  showKeyField();
}
function saveSettings(){
  try{
    const s = {
      provider: provSel.value,
      openai_key:$('k-openai').value, openai_model:$('m-openai').value,
      anthropic_key:$('k-anthropic').value, anthropic_model:$('m-anthropic').value,
      gemini_key:$('k-gemini').value, gemini_model:$('m-gemini').value,
      ollama_url:$('k-ollama').value, ollama_model:$('m-ollama').value,
      voiceOut: $('voiceOut').checked
    };
    localStorage.setItem('jarvis-settings', JSON.stringify(s));
    $('saveNote').textContent = 'Saved ✓';
    setTimeout(()=>$('saveNote').textContent='',1200);
  }catch(e){ $('saveNote').textContent = 'Could not save (private browsing?)'; }
}
function showKeyField(){
  Object.values(keyFields).forEach(el=>el.classList.remove('active'));
  keyFields[provSel.value].classList.add('active');
}
provSel.addEventListener('change', ()=>{showKeyField(); saveSettings();});
document.querySelectorAll('#sidebar input, #sidebar select').forEach(el=>el.addEventListener('change', saveSettings));
$('settingsBtn').addEventListener('click', ()=> $('sidebar').classList.toggle('open'));
loadSettings();

let pendingImage = null; // {mime, data (base64, no prefix)}
$('photoBtn').addEventListener('click', ()=> $('photoInput').click());
$('photoInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const [prefix, data] = reader.result.split(',');
    const mime = prefix.match(/data:(.*);base64/)[1];
    pendingImage = { mime, data };
    $('previewImg').src = reader.result;
    $('preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
});
$('clearPhoto').addEventListener('click', ()=>{
  pendingImage = null; $('preview').style.display='none'; $('photoInput').value='';
});

function addMsg(role, text, imageDataUrl){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role==='ai'){
    const who = document.createElement('div'); who.className='who'; who.textContent='JARVIS';
    div.appendChild(who);
    const body = document.createElement('div'); body.innerHTML = renderMarkdownish(text);
    div.appendChild(body);
  } else if(role==='sys'){
    div.textContent = text;
  } else {
    if(imageDataUrl){
      const img = document.createElement('img');
      img.src = imageDataUrl; img.style.maxWidth='220px'; img.style.borderRadius='6px'; img.style.display='block'; img.style.marginBottom='6px';
      div.appendChild(img);
    }
    const t = document.createElement('div'); t.textContent = text;
    div.appendChild(t);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
function renderMarkdownish(t){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(t).replace(/```([\s\S]*?)```/g, (m,c)=>'<pre><code>'+c.trim()+'</code></pre>')
               .replace(/`([^`]+)`/g,'<code>$1</code>')
               .replace(/\n/g,'<br>');
}

const history = [];
async function sendMessage(){
  const input = $('textInput');
  const text = input.value.trim();
  const image = pendingImage;
  if(!text && !image) return;
  input.value=''; autoResize();
  addMsg('user', text || '(image)', image ? ('data:'+image.mime+';base64,'+image.data) : null);
  history.push({role:'user', content: text || 'Describe/help with this image.', image});
  pendingImage = null; $('preview').style.display='none'; $('photoInput').value='';
  const thinking = addMsg('ai', 'thinking...');
  window.orbState = 'thinking';
  try{
    const reply = await callProvider(provSel.value, history);
    window.orbState = 'idle';
    thinking.querySelector('div:last-child').innerHTML = renderMarkdownish(reply);
    history.push({role:'assistant', content:reply});
    if($('voiceOut').checked) speak(reply);
  }catch(err){
    window.orbState = 'idle';
    thinking.querySelector('div:last-child').innerHTML = renderMarkdownish('Error: '+err.message);
  }
  log.scrollTop = log.scrollHeight;
}

const SYSTEM_PROMPT = "You are Jarvis, a concise, capable coding assistant. Give correct, working code. Explain briefly, prefer code blocks, avoid filler.";

async function callProvider(provider, hist){
  if(provider==='openai'){
    const key = $('k-openai').value.trim(); if(!key) throw new Error('No OpenAI key set');
    const messages = hist.map(m=>{
      if(m.image){
        return {role:m.role, content:[
          {type:'text', text:m.content},
          {type:'image_url', image_url:{url:'data:'+m.image.mime+';base64,'+m.image.data}}
        ]};
      }
      return {role:m.role, content:m.content};
    });
    const res = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({ model: $('m-openai').value.trim()||'gpt-4o',
        messages: [{role:'system',content:SYSTEM_PROMPT}, ...messages] })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    return data.choices[0].message.content;
  }
  if(provider==='anthropic'){
    const key = $('k-anthropic').value.trim(); if(!key) throw new Error('No Anthropic key set');
    const messages = hist.map(m=>{
      if(m.image){
        return {role:m.role, content:[
          {type:'image', source:{type:'base64', media_type:m.image.mime, data:m.image.data}},
          {type:'text', text:m.content}
        ]};
      }
      return {role:m.role, content:m.content};
    });
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json','x-api-key':key,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model: $('m-anthropic').value.trim()||'claude-sonnet-4-6', max_tokens:2048,
        system: SYSTEM_PROMPT,
        messages })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    return data.content.map(c=>c.text||'').join('\n');
  }
  if(provider==='gemini'){
    const key = $('k-gemini').value.trim(); if(!key) throw new Error('No Gemini key set');
    const model = $('m-gemini').value.trim()||'gemini-2.5-pro';
    const contents = hist.map(m=>{
      const parts = [{text:m.content}];
      if(m.image) parts.push({inline_data:{mime_type:m.image.mime, data:m.image.data}});
      return {role: m.role==='assistant'?'model':'user', parts};
    });
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ systemInstruction:{parts:[{text:SYSTEM_PROMPT}]}, contents })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts.map(p=>p.text).join('\n');
  }
  if(provider==='ollama'){
    const url = $('k-ollama').value.trim().replace(/\/$/,'') || 'http://localhost:11434';
    const model = $('m-ollama').value.trim()||'qwen2.5-coder';
    const messages = hist.map(m=>{
      const base = {role:m.role, content:m.content};
      if(m.image) base.images = [m.image.data];
      return base;
    });
    const res = await fetch(url+'/api/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model, stream:false,
        messages: [{role:'system',content:SYSTEM_PROMPT}, ...messages] })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data.message.content;
  }
}

$('sendBtn').addEventListener('click', sendMessage);
$('textInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
function autoResize(){
  const el = $('textInput'); el.style.height='auto'; el.style.height = Math.min(el.scrollHeight,120)+'px';
}
$('textInput').addEventListener('input', autoResize);

// Voice input
let recognition, listening=false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = e=>{
    $('textInput').value = e.results[0][0].transcript;
    autoResize();
    sendMessage();
  };
  recognition.onend = ()=>{ listening=false; $('micBtn').classList.remove('listening'); if(window.orbState==='listening') window.orbState='idle'; };
} else {
  $('micBtn').title = 'Voice input not supported in this browser';
}
$('micBtn').addEventListener('click', ()=>{
  if(!recognition) return;
  if(listening){ recognition.stop(); return; }
  listening = true; $('micBtn').classList.add('listening');
  window.orbState = 'listening';
  recognition.start();
});

// Voice output
function speak(text){
  if(!window.speechSynthesis) return;
  const clean = text.replace(/```[\s\S]*?```/g,' code block ').replace(/`/g,'');
  const u = new SpeechSynthesisUtterance(clean);
  u.rate = 1.02;
  u.onstart = ()=> window.orbState = 'speaking';
  u.onend = ()=> window.orbState = 'idle';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}
</script>
</body>
</html>
